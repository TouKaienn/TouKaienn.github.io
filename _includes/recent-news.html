

<style>
.news-list {
  margin: 1em 0;
  padding: 0;
}

.news-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 0.8em;
  line-height: 1.5;
}

.news-date {
  font-weight: bold;
  color: var(--global-theme-color, #002D72);
  margin-right: 1em;
  min-width: 80px;
  flex-shrink: 0;
}

.news-content {
  flex: 1;
  color: var(--global-text-color, #000000);
}

</style>

<ul class="news-list">
  {% for item in site.data.news.main %}
  <li class="news-item">
    <time class="news-date" datetime="{{ item.date }}">[{{ item.label | default: item.date }}]</time>
    <span class="news-content">{{ item.content }}</span>
  </li>
  {% endfor %}
</ul>
