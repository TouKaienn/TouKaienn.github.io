<div class="service-list">
  {% for category in site.data.services %}
  <section class="service-category">
    <h3>{{ category.title }}</h3>
    <ul>
      {% assign sorted_services = category.items | sort_natural: "venue" %}
      {% for service in sorted_services %}
      <li>{{ service.venue }}{% if service.years %} ({{ service.years }}){% endif %}</li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
</div>
